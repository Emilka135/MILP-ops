name: clinic-voice

x-module: &module
  restart: unless-stopped
  networks: [clinic]
  environment: &environment
    APP_MODE: ${APP_MODE:-demo}
    CRM_URL: http://crm:8080
    CRM_NOW: ${CRM_NOW:-}
    OPERATOR_AVAILABLE: ${OPERATOR_AVAILABLE:-1}
    CLINIC_NAME: ${CLINIC_NAME:-Демонстрационная поликлиника}
    CLINIC_PHONE: ${CLINIC_PHONE:-+7 (000) 000-00-00}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  deploy:
    resources:
      limits: {memory: 512M}

services:
  crm:
    <<: *module
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: crm}}
    environment:
      <<: *environment
      CRM_DB: /data/clinic.sqlite
      STAND_URL: ${STAND_URL:-}
      STAND_TOKEN: ${STAND_TOKEN:-}
      CRM_SCHEDULE: ${CRM_SCHEDULE:-}
      CRM_PATIENTS: ${CRM_PATIENTS:-}
      CRM_BOOKINGS: ${CRM_BOOKINGS:-}
      CRM_SERVICE_HOURS: ${CRM_SERVICE_HOURS:-}
      CRM_SERVICE_CALENDAR: ${CRM_SERVICE_CALENDAR:-}
    volumes: ["clinic-data:/data", "./imports:/imports:ro"]
  nlu:
    <<: *module
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: nlu, WITH_ML: "${WITH_BGE:-0}"}}
    environment:
      <<: *environment
      NLU_EMBEDDER: ${NLU_EMBEDDER:-hash}
      NLU_MODEL: ${NLU_MODEL:-/models/USER-bge-m3}
    volumes: ["./modules/nlu/models:/models:ro"]
    deploy:
      resources:
        limits: {memory: 4G}
  sms:
    <<: *module
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: sms}}
    environment:
      <<: *environment
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
  operator:
    <<: *module
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: operator}}
  tts:
    <<: *module
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: tts, WITH_ML: "${WITH_ML:-1}"}}
    environment:
      <<: *environment
      TTS_MODEL: /models/silero-v5_5_ru.pt
      TTS_SPEAKER: ${TTS_SPEAKER:-xenia}
      TTS_STRESS: "off"
      SCENARIO_DIR: /scenarios
      PROMPT_DIR: /audio
    volumes: ["./modules/tts/models:/models:ro", "./scenarios:/scenarios:ro", "audio-bank:/audio"]
    deploy:
      resources:
        limits: {memory: 3G}
  asr:
    <<: *module
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: asr, WITH_ML: "${WITH_ML:-1}"}}
    environment:
      <<: *environment
      ASR_MODEL: ${ASR_MODEL:-gigaam-v3-e2e-rnnt}
      ASR_MODEL_PATH: /models
      HF_HUB_OFFLINE: "1"
    volumes: ["./modules/asr/models:/models:ro"]
    deploy:
      resources:
        limits: {memory: 4G}
  orchestrator:
    restart: unless-stopped
    build: {context: ., dockerfile: docker/orchestrator.Dockerfile}
    networks: [clinic]
    environment:
      <<: *environment
      NLU_URL: http://nlu:8080
      SMS_URL: http://sms:8080
      OPERATOR_URL: http://operator:8080
      TTS_URL: http://tts:8080
      ASR_URL: http://asr:8080
      API_TOKEN: ${API_TOKEN:-}
      BIND: 0.0.0.0:8080
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    depends_on:
      crm: {condition: service_healthy}
      nlu: {condition: service_healthy}
      sms: {condition: service_healthy}
      operator: {condition: service_healthy}
      tts: {condition: service_healthy}
      asr: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 512M}
  scenario-editor:
    restart: unless-stopped
    build: {context: ., dockerfile: docker/editor.Dockerfile}
    networks: [clinic]
    environment:
      APP_MODE: ${APP_MODE:-demo}
      EDITOR_HOST: 0.0.0.0
      EDITOR_PORT: 8090
      EDITOR_DATA: /data
      EDITOR_ALLOW_BUILD: "1"
      AUDIO_BANK_DIR: /audio
      TTS_URL: http://tts:8080
    ports: ["127.0.0.1:${EDITOR_PORT:-8090}:8090"]
    volumes: ["./scenarios:/workspace/scenarios", "editor-data:/data", "editor-cargo:/workspace/target", "audio-bank:/audio:ro"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  stand:
    <<: *module
    profiles: [contract]
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: stand}}
    environment:
      <<: *environment
      STAND_STATE: /data/stand.json
      STAND_TOKEN: demo-token
    volumes: ["stand-data:/data"]
  outbound:
    <<: *module
    restart: "no"
    profiles: [telephony]
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: outbound}}
    healthcheck: {disable: true}
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *environment
      OUTBOUND_ENABLED: ${OUTBOUND_ENABLED:-0}
      ANTI_FRAUD_PUBLISHED: ${ANTI_FRAUD_PUBLISHED:-0}
      ARI_URL: http://host.docker.internal:8088
      ARI_PASSWORD: ${ARI_PASSWORD:-}
      SIP_OUTBOUND_ENDPOINT: ${SIP_OUTBOUND_ENDPOINT:-}
  ari-bridge:
    <<: *module
    profiles: [telephony]
    build: {context: ., dockerfile: docker/module.Dockerfile, args: {MODULE: crm}}
    command: ["python", "-m", "clinic.telephony"]
    healthcheck: {disable: true}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9092:9092"]
    environment:
      <<: *environment
      ORCHESTRATOR_URL: http://orchestrator:8080
      ARI_URL: http://host.docker.internal:8088
      ARI_PASSWORD: ${ARI_PASSWORD:-}
      API_TOKEN: ${API_TOKEN:-}
      AUDIOSOCKET_BIND: 0.0.0.0:9092
      AUDIOSOCKET_ADVERTISE: ${AUDIOSOCKET_ADVERTISE:-127.0.0.1:9092}
  telephony:
    profiles: [telephony]
    build: {context: ., dockerfile: docker/asterisk.Dockerfile}
    network_mode: host
    restart: unless-stopped
    environment:
      ARI_PASSWORD: ${ARI_PASSWORD:-}
      SIP_PHONE_PASSWORD: ${SIP_PHONE_PASSWORD:-}
      SIP_OPERATOR_PASSWORD: ${SIP_OPERATOR_PASSWORD:-}
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  clinic:
volumes:
  clinic-data:
  stand-data:
  audio-bank:
  editor-data:
  editor-cargo:
