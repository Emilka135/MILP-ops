[general]
static=yes
writeprotect=yes

[from-gateway]
exten => 114,1,Answer()
 same => n,Stasis(calls,inbound,${CALLERID(num)})
 same => n,Hangup()
exten => s,1,Goto(114,1)

[clinic-operator]
exten => s,1,NoOp(Operator escalation retained in the CRM queue)
 same => n,Dial(PJSIP/phone-114@gateway,30)
 same => n,Hangup()

[reminder-answered]
exten => s,1,Stasis(calls,reminder,${CALLERID(num)})
 same => n,Hangup()
