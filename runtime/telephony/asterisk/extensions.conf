; Minimal dialplan: every inbound call is handed to the orchestrator through ARI (Stasis), audio via AudioSocket.
[general]
static=yes
writeprotect=no

[from-trunk]
exten => _X.,1,NoOp(inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Set(CALL_UUID=${UNIQUEID})
 same => n,Stasis(calls,inbound,${CALLERID(num)})
 same => n,Hangup()

[outbound]
; originated by the orchestrator: ARI POST /channels with app=calls, appArgs=reminder,<campaign item id>
exten => _X.,1,NoOp(outbound ${EXTEN})
 same => n,Stasis(calls,reminder,${EXTEN})
 same => n,Hangup()
