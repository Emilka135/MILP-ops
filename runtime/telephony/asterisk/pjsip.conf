[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; local SIP trunk of the demo stand – replace host/credentials
[trunk]
type=endpoint
context=from-trunk
disallow=all
allow=alaw
allow=ulaw
dtmf_mode=rfc4733
aors=trunk
[trunk]
type=aor
contact=sip:trunk.local:5060
[trunk]
type=identify
endpoint=trunk
match=trunk.local
