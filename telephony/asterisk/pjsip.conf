[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[phone]
type=endpoint
transport=transport-udp
context=clinic-inbound
disallow=all
allow=alaw,ulaw
auth=phone-auth
aors=phone
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
[phone-auth]
type=auth
auth_type=userpass
username=phone
password=${SIP_PHONE_PASSWORD}
[phone]
type=aor
max_contacts=1
remove_existing=yes

[operator]
type=endpoint
transport=transport-udp
context=clinic-inbound
disallow=all
allow=alaw,ulaw
auth=operator-auth
aors=operator
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
[operator-auth]
type=auth
auth_type=userpass
username=operator
password=${SIP_OPERATOR_PASSWORD}
[operator]
type=aor
max_contacts=1
remove_existing=yes
