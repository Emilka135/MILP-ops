[package]
name = "clinic-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "bench-nlu"
path = "src/bin/bench_nlu.rs"
